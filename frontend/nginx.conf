# Nginx server configuration
server {
    # Listen for HTTP requests on port 8080 (Nginx runs as a non-root user,
    # which cannot bind to ports below 1024)
    listen 8080;

    # Accept requests for any hostname
    server_name _;

    # Allow incident attachments up to the backend's 10 MB limit (plus
    # multipart overhead). Nginx's default of 1 MB would reject most screenshots
    # with a 413 before they ever reach the backend.
    client_max_body_size 11m;

    # Location of the React production files
    root /usr/share/nginx/html;

    # Default file to serve
    index index.html;


    # -------- React Application --------
    # Serve React files and redirect unknown routes to index.html
    # This supports React Router routes such as /login and /dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }


    # -------- Backend API Proxy --------
    # Forward API requests from the frontend to the Spring Boot backend
    location /api/ {
        proxy_pass http://resolvex-backend:8080;

        # Use HTTP/1.1 for communication with the backend
        proxy_http_version 1.1;

        # Forward the original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}