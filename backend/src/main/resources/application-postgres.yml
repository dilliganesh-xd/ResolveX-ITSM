# PostgreSQL, opt in with: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#
# Not used by local development and not required to run the application. It is
# kept so the Flyway migrations in db/migration stay usable when a deployed
# environment wants PostgreSQL, and was verified end to end against
# PostgreSQL 16 in Phase 9.
#
# Here Flyway owns the schema and Hibernate only validates it, so a mapping that
# has drifted from the migrations fails at startup rather than at first query.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itsm}
    username: ${DB_USERNAME:itsm}
    password: ${DB_PASSWORD:itsm}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:validate}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
